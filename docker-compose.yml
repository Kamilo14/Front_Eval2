services:
  frontend:
  #significa que se va a construir la imagen a partir del Dockerfile ubicado en el mismo directorio
    build: .
    ## El nombre del contenedor es importante para que el backend pueda comunicarse con él usando el nombre del servicio
    container_name: flask-frontend
    restart: always
    ports:
      - "80:5000"
    env_file:
      - .env
    volumes:
      - frontend_data:/app/data
      - frontend_logs:/app/logs
    networks:
      - app-network

volumes:
  frontend_data:
    driver: local
  frontend_logs:
    driver: local

networks:
  app-network:
    external: true